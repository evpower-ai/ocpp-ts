name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write

    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          registry-url: "https://npm.pkg.github.com"
          cache: "npm"
          scope: '@evpower-ai'

      - run: npm ci

      - run: npm run build

      - run: npm test

      - name: Bump version
        # Reads commit messages to determine bump type:
        #   "BREAKING CHANGE" or "major" → major
        #   "feat" or "minor"            → minor
        #   default                      → patch
        uses: phips28/gh-action-bump-version@master
        with:
          tag-prefix: v
          major-wording: "BREAKING CHANGE,major"
          minor-wording: "feat,minor"
          commit-message: "ci: bump version to {{version}} [skip ci]"

      - name: Publish
        run: npm publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
